<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bac à Sable QA - Piano Analytics</title>

    <script>
    (function (_config) {
      var script = document.createElement("script");
      script.src = "https://tag.aticdn.net/piano-analytics.js";
      script.async = true;
      script.dataset.config = JSON.stringify(_config);
      document.head.appendChild(script);
    })({
      site: 123456789, 
      collectDomain: "https://xxxxxxx.pa-cd.com", 
      instantTracking: true,
      consentDefaultMode: "opt-in", 
    });
    </script>
    
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .btn-group { margin: 20px 0; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; }
        button { margin-right: 10px; padding: 8px 15px; cursor: pointer; }

        /* Style pour positionner l'image Marvin en bas à droite */
        .marvin-fixed {
            position: fixed;   /* Fixe l'image par rapport à la fenêtre du navigateur */
            bottom: 20px;      /* Distance par rapport au bas */
            right: 20px;       /* Distance par rapport à la droite */
            max-width: 150px;  /* Taille maximum de l'image (ajustable) */
            z-index: 1000;     /* S'assure que l'image passe au-dessus des autres éléments */
        }
    </style>
</head>
<body>

    <h1>Environnement de Test Piano Analytics</h1>
    <p>Cette page permet de valider la bonne intégration du tag et les changements d'états de consentement.</p>

    <div class="btn-group">
        <h2>Tester les modes de consentement</h2>
        <button id="btn-optin">Mode Opt-in (Tout accepter)</button>
        <button id="btn-essential">Mode Essential (Exempté)</button>
        <button id="btn-optout">Mode Opt-out (Tout refuser)</button>
    </div>

    <div class="btn-group">
        <h2>Tester les événements</h2>
        <button id="btn-test">Générer un clic de test</button>
    </div>

    <img src="Marvin.png" alt="Marvin" class="marvin-fixed">

    <script>
        const visitorId = "test_user_12345";

        function setConsentMode(mode) {
            if (!window.pa || !window.pa.consent || !window.pa.consent.setMode) {
                console.warn("No Piano consent API available for mode:", mode);
                return false;
            }
            window.pa.consent.setMode(mode);
            if (typeof window.pa.setVisitorId === "function") {
                window.pa.setVisitorId(visitorId);
            }
            console.log(`Le mode de consentement est passé en : ${mode}`);
            return true;
        }

        window.setConsentMode = setConsentMode;

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('btn-optin').addEventListener('click', function() {
                setConsentMode('opt-in');
            });
            document.getElementById('btn-essential').addEventListener('click', function() {
                setConsentMode('essential');
            });
            document.getElementById('btn-optout').addEventListener('click', function() {
                setConsentMode('opt-out');
            });
            document.getElementById('btn-test').addEventListener('click', function() {
                if (typeof pa !== 'undefined') {
                    pa.sendEvent('click.action', {
                        'click': 'bouton_test_qa',
                        'click_chapter1': 'bac_a_sable',
                        'click_chapter2': 'consulting'
                    });
                }
            });
        });
    </script>
</body>
</html>
